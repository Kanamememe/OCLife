name: Check frontend

on:
  push:
    branches: [main, feature/**, audit/**, hotfix/**]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax — all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
      - name: Materialize runtime release notice
        run: node scripts/materialize-release-notice.mjs
      - name: JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('announcements.json','utf8'))"
      - name: Release consistency and asset references
        run: node scripts/validate.mjs

  postgres-smoke:
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oclife
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oclife"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Shared-world SQL installer smoke test
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d oclife -f scripts/shared-sql-smoke.sql

  webkit-smoke:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Playwright client
        run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - name: Core WebKit browser smoke test
        run: node scripts/browser-smoke.mjs
      - name: World data editor WebKit smoke test
        run: node scripts/world-editor-smoke.mjs
      - name: Moment reply binding WebKit smoke test
        run: node scripts/moment-reply-smoke.mjs
      - name: Photo moment WebKit smoke test
        run: node scripts/photo-moment-smoke.mjs
      - name: Photo multi-upload WebKit smoke test
        run: node scripts/photo-multi-upload-smoke.mjs
      - name: Photo publish and character exclusivity WebKit smoke test
        run: node scripts/photo-publish-smoke.mjs
      - name: Story reactions WebKit smoke test
        run: node scripts/story-reactions-smoke.mjs
      - name: Question memory WebKit smoke test
        run: node scripts/question-memory-smoke.mjs
      - name: Shared-world two-client WebKit smoke test
        run: node scripts/shared-world-smoke.mjs
