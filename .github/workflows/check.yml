name: Check frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check js/store.js
          node --check js/simulator.js
          node --check js/ai.js
          node --check js/app.js
          node --check js/provider-settings.js
      - name: Required files
        run: |
          test -s index.html
          test -s css/app.css
          test -s js/ai.js
          test -s js/provider-settings.js
