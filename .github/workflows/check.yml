name: Check frontend

on:
  push:
    branches: [main, feature/**]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax — all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
      - name: JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('announcements.json','utf8'))"
      - name: Release consistency and asset references
        run: node scripts/validate.mjs
