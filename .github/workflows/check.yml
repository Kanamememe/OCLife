name: Check frontend

on:
  push:
    branches: [main, feature/**]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax — all modules
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | sort -z)
      - name: JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('version.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('announcements.json','utf8'))"
      - name: Release consistency and asset references
        run: node scripts/validate.mjs

  webkit-smoke:
    needs: validate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching Playwright client
        run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - name: WebKit browser smoke test
        run: node scripts/browser-smoke.mjs
