<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ec" />
  <title>OC Life</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="返回">←</button>
      <div class="topbar-title">
        <div id="crumb" class="eyebrow">OC LIFE</div>
        <h1 id="pageTitle">我的世界</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙︎</button>
    </header>

    <main id="view"></main>

    <nav id="worldNav" class="bottom-nav hidden">
      <button data-tab="now" class="active">現在</button>
      <button data-tab="chat">聊天</button>
      <button data-tab="moments">動態</button>
      <button data-tab="characters">角色</button>
      <button data-tab="world">世界</button>
    </nav>
  </div>

  <div id="modalRoot"></div>

  <script src="js/store.js"></script>
  <script src="js/simulator.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
  <script src="js/provider-settings.js"></script>
  <script src="js/character-card-ai.js"></script>
  <script src="js/character-editor.js"></script>
</body>
</html>
